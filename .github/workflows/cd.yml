name: cd

on:
  push:
    branches: [main]

jobs:
  tests:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"

      - name: Build app
        run: scripts/buildprod.sh
    
      - id: "auth"
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: "${{ secrets.GCP_CRED }}"

      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v3"

      - name: "Use gcloud CLI"
        run: "gcloud info"

      - name: "Build Docker image"
        run: "gcloud builds submit --tag us-central1-docker.pkg.dev/annular-sky-506422-u3/notely-ar-repo/notely ."
      
      - name: Deploy to Cloud Run
        run: gcloud run deploy notely --image us-central1-docker.pkg.dev/annular-sky-506422-u3/notely-ar-repo/notely:latest --region us-central1 --allow-unauthenticated --project annular-sky-506422-u3 --max-instances=4